name: Test pilot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax and PWA asset checks
        run: |
          node --check app.js
          node --check install.js
          node --check share.js
          node --check sw.js
          python3 - <<'PY'
          import json, os, re
          with open("manifest.webmanifest", encoding="utf-8") as f:
              manifest=json.load(f)
          with open("vercel.json", encoding="utf-8") as f:
              json.load(f)
          assert manifest["start_url"]=="./app.html"
          assert len(manifest.get("icons", [])) >= 2
          for icon in manifest["icons"]:
              assert os.path.exists(icon["src"]), icon["src"]

          with open("sw.js", encoding="utf-8") as f:
              sw=f.read()
          assert "event.request.mode==='navigate'" in sw, "navigation fallback missing"
          assets=re.findall(r"'(\./[^']+)'", sw)
          assert assets, "service worker asset list missing"
          for asset in assets:
              path=asset[2:]
              if not path:
                  continue
              assert os.path.exists(path), f"missing cached asset: {path}"
          print("manifest and service-worker assets OK")
          PY

      - name: Start local server
        run: |
          python3 -m http.server 8765 >/tmp/aktywnik-http.log 2>&1 &
          echo $! > /tmp/aktywnik-http.pid
          sleep 2

      - name: Browser UI smoke test
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME"             --headless=new             --no-sandbox             --disable-gpu             --user-data-dir=/tmp/aktywnik-chrome             --virtual-time-budget=12000             --dump-dom             'http://127.0.0.1:8765/tests/smoke.html?skipPwa=1'             > /tmp/aktywnik-smoke.html
          grep -o '<div id="result"[^>]*>[^<]*' /tmp/aktywnik-smoke.html || true
          grep -q 'data-test="pass"' /tmp/aktywnik-smoke.html
          grep -q 'PASS: PIN roles, multi-child isolation, child edit, parent correction/rejection, audit, migration, backup and PWA' /tmp/aktywnik-smoke.html
          echo "Aktywnik+ browser smoke PASS"
