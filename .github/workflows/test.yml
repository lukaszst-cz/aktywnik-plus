name: Test pilot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Syntax and PWA asset checks
        run: |
          node --check app.js
          grep -q "familyCloudLinkReady:true" api/capabilities.js
          grep -q "familyCloudChildSelect" app.html
          grep -q "cloudChildId" app.js
          node --check i18n.js
          node --check auth-config.js
          node --check auth.js
          node --check sync-client.js
          node --check family-sync-client.js
          node --check school-cloud.js
          grep -q "AbortController" school-cloud.js
          grep -q "request_timeout" school-cloud.js
          node --check install.js
          node --check share.js
          node --check paper.js
          node --check teacher.js
          node --check sw.js
          node --check tests/production-smoke.mjs
          node --check api/health.js
          node --check api/capabilities.js
          node --check api/_lib/backend.js
          node --check api/_lib/supabase.js
          node --check api/_lib/idempotency.js
          test -f backend/migrations/023_school_cloud_idempotency.sql
          test -f backend/tests/school_idempotency.sql
          grep -q "create_guardian_child_idempotent" backend/migrations/023_school_cloud_idempotency.sql
          grep -q "idempotency_keys" backend/tests/security_preflight.sql
          grep -q "OP_STORAGE_KEY" school-cloud.js
          node --check api/v1/classes.js
          node --check api/v1/family-children.js
          node --check api/v1/class-invites.js
          node --check api/v1/class-join.js
          node --check api/v1/me.js
          node --check api/v1/school-years.js
          node --check api/v1/sync.js
          node --check api/v1/family-sync.js
          test -f backend/migrations/022_family_activity_sync.sql
          test -f backend/tests/family_activity_sync.sql
          test -f backend/migrations/024_family_activity_tombstones.sql
          test -f backend/tests/family_delete_sync.sql
          grep -q "family_activity_tombstones" backend/migrations/024_family_activity_tombstones.sql
          grep -q "activities_delete_family_guardian" backend/migrations/024_family_activity_tombstones.sql
          test -f backend/migrations/025_family_decision_history.sql
          test -f backend/tests/family_decision_history.sql
          grep -q "client_event_id" backend/migrations/025_family_decision_history.sql
          grep -q "on delete set null" backend/migrations/025_family_decision_history.sql
          grep -q "familySyncBeta:cloud.enabled" api/capabilities.js
          grep -q "familySync:cloud.enabled" api/capabilities.js
          grep -q "familySyncProtocolVersion:1" api/capabilities.js
          grep -q "familySyncDeletes:cloud.enabled" api/capabilities.js
          grep -q "familySyncDecisionHistory:cloud.enabled" api/capabilities.js
          grep -q "family-sync-client.js" app.html
          grep -q "./family-sync-client.js" sw.js
          test -f backend/tests/application_restore_drill.sql
          grep -q "^rollback;" backend/tests/application_restore_drill.sql
          grep -q "applicationRestoreDrillVerified:true" api/capabilities.js
          test -f backend/migrations/018_profile_type_role_hardening.sql
          test -f backend/tests/profile_role_escalation.sql
          grep -q "grant update(display_name)" backend/migrations/018_profile_type_role_hardening.sql
          grep -q "profile_update_columns" backend/tests/security_preflight.sql
          test -f backend/migrations/019_school_audit_retention.sql
          test -f backend/tests/school_audit_retention.sql
          test -f backend/migrations/020_public_rpc_invoker_wrappers.sql
          grep -q "security invoker" backend/migrations/020_public_rpc_invoker_wrappers.sql
          grep -q "app_private.create_class_invite_secure" backend/migrations/020_public_rpc_invoker_wrappers.sql
          grep -q "app_private.create_guardian_child_secure" backend/migrations/020_public_rpc_invoker_wrappers.sql
          grep -q "publicSecurityDefinerRpcSurface:false" api/capabilities.js
          grep -q "create or replace function app_private.audit_school_change" backend/migrations/019_school_audit_retention.sql
          grep -q "create or replace function app_private.prune_audit_events" backend/migrations/019_school_audit_retention.sql
          grep -q "school_audit_trigger_count" backend/tests/security_preflight.sql
          grep -q "schoolRetentionMechanismReady:true" api/capabilities.js
          grep -q "schoolRetentionPolicyConfigured:false" api/capabilities.js
          grep -q "school-cloud.html" index.html
          grep -q "school-cloud.html" dla-nauczyciela.html
          grep -q "school-cloud.html" faq.html
          ! grep -q "pełny lifecycle klasy jest nadal rozwijany" index.html
          python3 tests/security-static.py
          python3 tests/performance-static.py
          python3 tests/release-consistency.py
          python3 - <<'PY'
          import json, os, re
          with open("manifest.webmanifest", encoding="utf-8") as f:
              manifest=json.load(f)
          with open("vercel.json", encoding="utf-8") as f:
              json.load(f)
          assert manifest["start_url"]=="./app.html"
          assert len(manifest.get("icons", [])) >= 2
          for icon in manifest["icons"]:
              assert os.path.exists(icon["src"]), icon["src"]

          with open("sw.js", encoding="utf-8") as f:
              sw=f.read()
          assert "event.request.mode==='navigate'" in sw, "navigation fallback missing"
          assets=re.findall(r"'(\./[^']+)'", sw)
          assert assets, "service worker asset list missing"
          for asset in assets:
              path=asset[2:]
              if not path:
                  continue
              assert os.path.exists(path), f"missing cached asset: {path}"
          print("manifest and service-worker assets OK")

          for page in ("paper.html","dla-nauczyciela.html","paper-uniwersalny.html"):
              with open(page, encoding="utf-8") as f:
                  html=f.read()
              assert "onclick=" not in html, f"inline handler blocked by CSP: {page}"
              assert "<script>" not in html, f"inline script blocked by CSP: {page}"
          print("CSP-safe public pages OK")

          with open("konto.html", encoding="utf-8") as f:
              account=f.read()
          with open("school-cloud.html", encoding="utf-8") as f:
              school_cloud=f.read()
          with open("auth.js", encoding="utf-8") as f:
              auth=f.read()
          with open("auth-config.js", encoding="utf-8") as f:
              auth_config=f.read()
          with open("sync-client.js", encoding="utf-8") as f:
              sync_client=f.read()
          with open("family-sync-client.js", encoding="utf-8") as f:
              family_sync_client=f.read()
          with open("vercel.json", encoding="utf-8") as f:
              vercel=json.load(f)
          assert 'auth-config.js' in account and 'auth.js' in account, "account auth scripts missing"
          assert 'school-cloud.html' in account, "School Cloud link missing from account"
          assert 'auth-config.js' in school_cloud and 'auth.js' in school_cloud and 'school-cloud.js' in school_cloud, "School Cloud auth/scripts missing"
          assert 'schoolCreateChildBtn' in school_cloud and 'schoolNewChildName' in school_cloud, "School Cloud child onboarding controls missing"
          assert 'SUPABASE_SERVICE_ROLE_KEY' not in auth and 'SUPABASE_SECRET_KEY' not in auth, "server key leaked to client auth"
          assert 'SUPABASE_SECRET_KEY' not in sync_client and 'SUPABASE_SERVICE_ROLE_KEY' not in sync_client, "server key leaked to sync client"
          assert 'SUPABASE_SECRET_KEY' not in family_sync_client and 'SUPABASE_SERVICE_ROLE_KEY' not in family_sync_client, "server key leaked to family sync client"
          assert '/api/v1/family-sync' in family_sync_client and 'minimalFamilySnapshot' in family_sync_client, "family sync client foundation missing"
          assert 'sb_publishable_' in auth_config, "publishable key missing"
          assert "markDirty" in sync_client and "/api/v1/sync" in sync_client, "sync queue client missing"
          csp=next(h["value"] for x in vercel["headers"] if x["source"]=="/(.*)" for h in x["headers"] if h["key"]=="Content-Security-Policy")
          assert "https://rgvmjglahubbglkolwug.supabase.co" in csp, "Supabase connect-src missing"
          print("account auth/CSP checks OK")
          PY

      - name: Set up Node for browser runner
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Start local server
        run: |
          python3 -m http.server 8765 >/tmp/aktywnik-http.log 2>&1 &
          echo $! > /tmp/aktywnik-http.pid
          sleep 2

      - name: Paper form browser smoke
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/aktywnik-paper-chrome --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:8765/paper.html' > /tmp/aktywnik-paper.html
          test "$(grep -o '<tr><td>' /tmp/aktywnik-paper.html | wc -l)" -eq 70
          echo "Paper form 70 rows PASS"

      - name: Browser UI smoke test
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --no-first-run \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/aktywnik-chrome \
            'http://127.0.0.1:8765/tests/smoke.html?skipPwa=1' \
            >/tmp/aktywnik-chrome.log 2>&1 &
          echo $! > /tmp/aktywnik-chrome.pid
          sleep 2
          node tests/run-smoke.mjs 9222 'http://127.0.0.1:8765/tests/smoke.html'
          echo "Aktywnik+ browser smoke PASS"

      - name: I18n browser smoke test
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --no-first-run \
            --remote-debugging-port=9224 \
            --user-data-dir=/tmp/aktywnik-chrome-i18n \
            'http://127.0.0.1:8765/tests/i18n-smoke.html' \
            >/tmp/aktywnik-chrome-i18n.log 2>&1 &
          echo $! > /tmp/aktywnik-chrome-i18n.pid
          sleep 2
          node tests/run-smoke.mjs 9224 'http://127.0.0.1:8765/tests/i18n-smoke.html'
          echo "Aktywnik+ i18n smoke PASS"

      - name: PWA runtime smoke test
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --no-first-run \
            --remote-debugging-port=9223 \
            --user-data-dir=/tmp/aktywnik-chrome-pwa \
            'http://127.0.0.1:8765/tests/pwa-smoke.html' \
            >/tmp/aktywnik-chrome-pwa.log 2>&1 &
          echo $! > /tmp/aktywnik-chrome-pwa.pid
          sleep 2
          node tests/run-smoke.mjs 9223 'http://127.0.0.1:8765/tests/pwa-smoke.html'
          echo "Aktywnik+ PWA runtime smoke PASS"

      - name: Backend API unit smoke
        run: |
          node - <<'NODE'
          (async()=>{
          function mock(){
            const out={statusCode:200,headers:{},body:null};
            return {
              out,
              setHeader(k,v){out.headers[k]=v},
              status(n){out.statusCode=n;return this},
              json(v){out.body=v;return this}
            };
          }
          for (const file of ['./api/health.js','./api/capabilities.js']){
            const handler=require(file);
            const res=mock();
            handler({method:'GET'},res);
            if(res.out.statusCode!==200) throw new Error(file+' status');
            if(!res.out.body) throw new Error(file+' no body');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.personalSyncProtocolVersion!==1) throw new Error('sync protocol capability missing');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.applicationRestoreDrillVerified!==true) throw new Error('application restore capability missing');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.profileRoleEscalationBlocked!==true) throw new Error('profile role hardening capability missing');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.familyCloudLinkReady!==true) throw new Error('family cloud link readiness missing');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.familySyncBeta!==false) throw new Error('family sync beta must fail closed when cloud is off');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.familySync!==false) throw new Error('full family sync must fail closed when cloud is off');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.familySyncDeletes!==false) throw new Error('family delete sync must fail closed when cloud is off');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.familySyncDecisionHistory!==false) throw new Error('family decision history must fail closed when cloud is off');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.familySyncProtocolVersion!==1) throw new Error('family sync protocol capability missing');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.schoolAuditCoverageVerified!==true) throw new Error('school audit capability missing');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.schoolRetentionMechanismReady!==true) throw new Error('school retention mechanism capability missing');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.schoolRetentionPolicyConfigured!==false) throw new Error('school retention policy must remain externally configurable');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.publicSecurityDefinerRpcSurface!==false) throw new Error('public SECURITY DEFINER surface must stay disabled');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.schoolLifecycleRpcPrivilegeModel!=='public_invoker_private_definer') throw new Error('school lifecycle RPC privilege model mismatch');
            if(file.endsWith('capabilities.js')&&res.out.body?.cloud?.familyCloudOnboarding!==false) throw new Error('family onboarding capability must fail closed when cloud is off');
          }
          const health=require('./api/health.js');
          const denied=mock();
          health({method:'POST'},denied);
          if(denied.out.statusCode!==405) throw new Error('health method guard');
          console.log('backend API smoke OK');

          const classes=require('./api/v1/classes.js');
          const classInvites=require('./api/v1/class-invites.js');
          const familyChildren=require('./api/v1/family-children.js');
          const classJoin=require('./api/v1/class-join.js');
          const schoolYears=require('./api/v1/school-years.js');
          const me=require('./api/v1/me.js');
          const sync=require('./api/v1/sync.js');
          const familySync=require('./api/v1/family-sync.js');
          for (const [handler,req] of [
            [classes,{method:'GET'}],
            [familyChildren,{method:'POST',body:{displayName:'Test'}}],
            [classInvites,{method:'POST',body:{}}],
            [classJoin,{method:'GET',query:{}}],
            [schoolYears,{method:'GET',query:{}}],
            [me,{method:'GET'}],
            [sync,{method:'GET'}],
            [familySync,{method:'GET',query:{childId:'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee'}}]
          ]){
            const res=mock();
            await handler(req,res);
            if(res.out.statusCode!==503) throw new Error('cloud endpoint must fail closed');
            if(res.out.body?.error!=='cloud_sync_disabled') throw new Error('cloud endpoint guard missing');
          }
          console.log('backend fail-closed guards OK');

          process.env.AKTYWNIK_CLOUD_SYNC='true';
          process.env.AKTYWNIK_RLS_VERIFIED='true';
          process.env.AUTH_MODE='supabase';
          process.env.SUPABASE_URL='https://example.supabase.co';
          delete process.env.SUPABASE_SECRET_KEY;
          delete process.env.SUPABASE_SERVICE_ROLE_KEY;
          process.env.SUPABASE_PUBLISHABLE_KEY='sb_publishable_test';

          const enabledCaps=mock();
          require('./api/capabilities.js')({method:'GET'},enabledCaps);
          if(enabledCaps.out.statusCode!==200) throw new Error('enabled capabilities status');
          if(enabledCaps.out.body?.cloud?.familySync!==true) throw new Error('full family sync capability did not enable');
          if(enabledCaps.out.body?.cloud?.familySyncDeletes!==true) throw new Error('family delete sync capability did not enable');
          if(enabledCaps.out.body?.cloud?.familySyncDecisionHistory!==true) throw new Error('family decision history capability did not enable');
          if(enabledCaps.out.body?.cloud?.familySyncProtocolVersion!==1) throw new Error('family sync protocol capability mismatch');

          const originalFetch=global.fetch;
          let calls=[];
          let missingIdempotent=false;
          let missingFamilyTombstones=false;
          let missingDecisionHistory=false;
          global.fetch=async (url,options={})=>{
            calls.push({url:String(url),options});
            if(String(url).includes('/auth/v1/user')){
              return {ok:true,status:200,text:async()=>JSON.stringify({id:'11111111-1111-4111-8111-111111111111',email:'test@example.com'})};
            }
            if(String(url).includes('/rest/v1/personal_activity_tombstones')){
              if((options.method||'GET').toUpperCase()==='POST')return {ok:true,status:201,text:async()=>''};
              return {ok:true,status:200,text:async()=>JSON.stringify([])};
            }
            if(String(url).includes('/rest/v1/personal_activities')){
              const method=String(options.method||'GET').toUpperCase();
              if(method==='POST')return {ok:true,status:201,text:async()=>''};
              if(method==='DELETE')return {ok:true,status:204,text:async()=>''};
              return {ok:true,status:200,text:async()=>JSON.stringify([{
                client_entry_id:'33333333-3333-4333-8333-333333333333',
                activity_date:'2026-10-02',
                activity_type:'Rower',
                minutes:44,
                effort:3,
                note:'cloud',
                source:'manual',
                client_updated_at:'2026-10-02T20:05:00.000Z',
                updated_at:'2026-10-02T20:05:00.000Z'
              }])};
            }
            if(String(url).includes('/rest/v1/profiles')){
              return {ok:true,status:200,text:async()=>JSON.stringify([{id:'11111111-1111-4111-8111-111111111111',display_name:'Tester',profile_type:'adult'}])};
            }
            if(String(url).includes('/rest/v1/memberships')){
              return {ok:true,status:200,text:async()=>JSON.stringify([{tenant_id:'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',role:'guardian',active:true}])};
            }
            if(String(url).includes('/rest/v1/guardians')){
              const allowed=String(url).includes('eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee');
              return {ok:true,status:200,text:async()=>JSON.stringify(allowed?[{child_id:'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee'}]:[])};
            }
            if(String(url).includes('/rest/v1/family_activity_tombstones')){
              if(missingFamilyTombstones)return {ok:false,status:404,text:async()=>JSON.stringify({code:'PGRST205',message:"Could not find the table 'public.family_activity_tombstones' in the schema cache"})};
              const method=String(options.method||'GET').toUpperCase();
              if(method==='POST')return {ok:true,status:201,text:async()=>''};
              return {ok:true,status:200,text:async()=>JSON.stringify([{
                client_entry_id:'67676767-6767-4676-8676-676767676767',
                deleted_at:'2026-10-03T08:30:00.000Z'
              }])};
            }
            if(String(url).includes('/rest/v1/activity_approval_events')){
              if(missingDecisionHistory)return {ok:false,status:400,text:async()=>JSON.stringify({code:'PGRST204',message:"Could not find the 'client_event_id' column"})};
              const method=String(options.method||'GET').toUpperCase();
              if(method==='POST')return {ok:true,status:201,text:async()=>''};
              return {ok:true,status:200,text:async()=>JSON.stringify([{
                client_event_id:'89898989-8989-4989-8989-898989898989',
                client_entry_id:'56565656-5656-4565-8565-565656565656',
                decision:'approved',
                reason:'Rodzic zatwierdził wpis.',
                before_state:{status:'pending'},
                after_state:{status:'approved'},
                decided_at:'2026-10-03T08:40:00.000Z'
              }])};
            }
            if(String(url).includes('/rest/v1/activities')){
              const method=String(options.method||'GET').toUpperCase();
              if(method==='POST')return {ok:true,status:201,text:async()=>''};
              if(method==='DELETE')return {ok:true,status:204,text:async()=>''};
              return {ok:true,status:200,text:async()=>JSON.stringify([{
                client_entry_id:'56565656-5656-4565-8565-565656565656',
                activity_date:'2026-10-02',
                activity_type:'Spacer',
                minutes:35,
                effort:2,
                note:'family cloud',
                status:'approved',
                source:'manual',
                rejection_reason:null,
                approved_at:'2026-10-02T20:06:00.000Z',
                client_updated_at:'2026-10-02T20:06:00.000Z',
                updated_at:'2026-10-02T20:06:00.000Z'
              }])};
            }
            if(String(url).includes('/rest/v1/children')){
              return {ok:true,status:200,text:async()=>JSON.stringify([{id:'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',display_name:'Dziecko Test'}])};
            }
            if(String(url).includes('/rest/v1/school_years')){
              return {ok:true,status:200,text:async()=>JSON.stringify([{id:'ffffffff-ffff-4fff-8fff-ffffffffffff',tenant_id:'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',label:'2026/2027',archived_at:null}])};
            }
            if(String(url).includes('/rest/v1/rpc/create_guardian_child_idempotent')){
              if(missingIdempotent)return {ok:false,status:404,text:async()=>JSON.stringify({code:'PGRST202',message:'Could not find the function'})};
              return {ok:true,status:200,text:async()=>JSON.stringify('abababab-abab-4bab-8bab-abababababab')};
            }
            if(String(url).includes('/rest/v1/rpc/create_school_class_idempotent')){
              if(missingIdempotent)return {ok:false,status:404,text:async()=>JSON.stringify({code:'PGRST202',message:'Could not find the function'})};
              return {ok:true,status:200,text:async()=>JSON.stringify('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbc')};
            }
            if(String(url).includes('/rest/v1/rpc/create_class_invite_idempotent')){
              if(missingIdempotent)return {ok:false,status:404,text:async()=>JSON.stringify({code:'PGRST202',message:'Could not find the function'})};
              return {ok:true,status:200,text:async()=>JSON.stringify('cccccccc-cccc-4ccc-8ccc-cccccccccccc')};
            }
            if(String(url).includes('/rest/v1/rpc/create_guardian_child')){
              return {ok:true,status:200,text:async()=>JSON.stringify('abababab-abab-4bab-8bab-abababababab')};
            }
            if(String(url).includes('/rest/v1/rpc/create_school_class')){
              return {ok:true,status:200,text:async()=>JSON.stringify('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbc')};
            }
            if(String(url).includes('/rest/v1/rpc/create_class_invite')){
              return {ok:true,status:200,text:async()=>JSON.stringify('cccccccc-cccc-4ccc-8ccc-cccccccccccc')};
            }
            if(String(url).includes('/rest/v1/rpc/request_class_join')){
              return {ok:true,status:200,text:async()=>JSON.stringify('dddddddd-dddd-4ddd-8ddd-dddddddddddd')};
            }
            if(String(url).includes('/rest/v1/rpc/decide_class_join')){
              return {ok:true,status:200,text:async()=>JSON.stringify(true)};
