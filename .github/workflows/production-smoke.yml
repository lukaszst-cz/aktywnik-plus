name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected production version
        required: true
        default: 0.5.0-beta.4
      require_cloud:
        description: Require production cloud gate to be enabled
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify production smoke scripts
        run: |
          node --check tests/production-smoke.mjs
          node --check tests/production-ui-smoke.mjs

      - name: Verify production deployment
        env:
          AKTYWNIK_BASE_URL: https://aktywnik-plus.vercel.app
          AKTYWNIK_EXPECTED_VERSION: ${{ inputs.expected_version || '0.5.0-beta.4' }}
          AKTYWNIK_EXPECTED_COMMIT: ${{ github.sha }}
          AKTYWNIK_REQUIRE_CLOUD: ${{ inputs.require_cloud || 'true' }}
        run: |
          for attempt in $(seq 1 18); do
            echo "Production smoke attempt $attempt/18"
            if node tests/production-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "Production did not converge to the expected release."
              exit 1
            fi
            sleep 10
          done

      - name: Verify production family UI
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --no-first-run \
            --remote-debugging-port=9225 \
            --user-data-dir=/tmp/aktywnik-production-ui \
            'https://aktywnik-plus.vercel.app/app.html?production-ui-smoke=1' \
            >/tmp/aktywnik-production-ui.log 2>&1 &
          echo $! > /tmp/aktywnik-production-ui.pid
          sleep 2
          node tests/production-ui-smoke.mjs 9225 'https://aktywnik-plus.vercel.app/app.html'
          echo "Aktywnik+ production family UI smoke PASS"
