<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Aktywnik+ smoke test</title>
<style>body{font-family:system-ui;padding:20px}.pass{color:#166534}.fail{color:#b91c1c}iframe{width:1px;height:1px;opacity:.01}</style>
</head>
<body>
<h1>Aktywnik+ smoke test</h1>
<div id="result">RUNNING</div>
<iframe id="appFrame"></iframe>
<script>
const KEY='aktywnik-plus-data-v1';
const result=document.getElementById('result');
const skipPwaChecks=new URLSearchParams(location.search).has('skipPwa');
function fail(msg){result.className='fail';result.textContent='FAIL: '+msg;document.body.dataset.test='fail'}
function pass(msg){result.className='pass';result.textContent='PASS: '+msg;document.body.dataset.test='pass'}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function run(){
  try{
    localStorage.removeItem(KEY);
    const f=document.getElementById('appFrame');

    async function loadApp(label){
      f.src='../app.html?smoke='+label+'-'+Date.now();
      await new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>reject(new Error('app load timeout')),5000);
        f.onload=()=>{clearTimeout(timer);resolve()}
      });
      await sleep(300);
      return {w:f.contentWindow,d:f.contentDocument};
    }

    let {w,d}=await loadApp('first');
    if(!d.getElementById('pilotSetupCard')) throw new Error('pilot setup missing');
    if(!d.getElementById('skipPilotNameBtn')) throw new Error('skip pilot name button missing');

    // Direct role links should not require login/setup for teacher.
    f.src='../app.html?mode=school&smoke=direct-'+Date.now();
    await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('direct mode load timeout')),5000);f.onload=()=>{clearTimeout(timer);resolve()}});
    await sleep(200);
    w=f.contentWindow;d=f.contentDocument;
    if(d.getElementById('schoolPanel').classList.contains('hidden')) throw new Error('direct school mode failed');
    if(!d.getElementById('pilotSetupCard').classList.contains('hidden')) throw new Error('pilot setup blocks school mode');

    ({w,d}=await loadApp('child-setup'));
    d.getElementById('pilotChildName').value='Test D.';
    d.getElementById('startPilotBtn').click();
    await sleep(100);
    if(!d.getElementById('pilotSetupCard').classList.contains('hidden')) throw new Error('pilot setup did not close');

    let spacer=[...d.querySelectorAll('.activity')].find(x=>x.textContent.includes('Spacer'));
    if(!spacer) throw new Error('activity button missing');

    spacer.click();
    d.getElementById('activityNote').value='timer smoke';
    d.getElementById('startTimerBtn').click();
    await sleep(100);
    let timerSaved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(!timerSaved.activeTimer || timerSaved.activeTimer.activity!=='Spacer') throw new Error('timer did not start');

    timerSaved.activeTimer.startAt=new Date(Date.now()-125000).toISOString();
    localStorage.setItem(KEY,JSON.stringify(timerSaved));
    ({w,d}=await loadApp('timer-reload'));
    if(d.getElementById('timerStatusCard').classList.contains('hidden')) throw new Error('timer did not survive reload');
    d.getElementById('stopTimerBtn').click();
    await sleep(100);

    timerSaved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(timerSaved.activeTimer) throw new Error('timer did not stop');
    if(timerSaved.entries?.length!==1 || timerSaved.entries[0].source!=='timer') throw new Error('timer entry not saved');

    spacer=[...d.querySelectorAll('.activity')].find(x=>x.textContent.includes('Spacer'));
    spacer.click();
    const ninety=d.querySelector('[data-duration="90"]');
    if(!ninety) throw new Error('quick duration preset missing');
    ninety.click();
    if(d.getElementById('activityDuration').value!=='90') throw new Error('quick duration preset failed');
    d.getElementById('activityDuration').value='25';
    d.getElementById('activityNote').value='smoke test';
    d.getElementById('saveEntryBtn').click();
    await sleep(100);

    d.getElementById('parentModeBtn').click();
    await sleep(50);
    if(!d.getElementById('exportCsvBtn')) throw new Error('CSV export button missing');
    if(typeof w.exportReportCsv!=='function') throw new Error('CSV export function missing');
    if(d.getElementById('pendingCount').textContent!=='2') throw new Error('pending count is not 2');
    d.getElementById('approveAllBtn').click();
    await sleep(100);

    let saved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(saved.pilot?.childDisplayName!=='Test D.') throw new Error('pilot name not saved');
    if(saved.entries?.length!==2) throw new Error('entries not saved');
    if(saved.entries.some(e=>e.status!=='approved')) throw new Error('entries not approved');
    if(!d.getElementById('parentReport').textContent.includes('Test D.')) throw new Error('report does not contain pilot name');

    d.getElementById('schoolModeBtn').click();
    if(typeof w.parseDelimitedImport!=='function') throw new Error('paper import parser missing');
    const imported=w.parseDelimitedImport('Data;Aktywność;Czas;Wysiłek;Uwagi\n2026-10-01;Judo;1,5 h;3;trening');
    if(imported.length!==1 || imported[0].minutes!==90 || imported[0].activity!=='Judo') throw new Error('paper import parser failed');
    d.getElementById('newClassName').value='5A — TEST';
    d.getElementById('createClassBtn').click();
    await sleep(100);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(saved.classes?.length!==1 || !saved.classes[0].code) throw new Error('local class demo failed');

    d.getElementById('paperChildName').value='Test A.';
    d.getElementById('addPaperChildBtn').click();
    await sleep(50);
    d.getElementById('paperChildName').value='Test B.';
    d.getElementById('addPaperChildBtn').click();
    await sleep(100);
    const reportSelectors=[...d.querySelectorAll('[data-report-child]')];
    if(reportSelectors.length!==2) throw new Error('two local class children not rendered');
    reportSelectors[1].value='submitted';
    reportSelectors[1].dispatchEvent(new w.Event('change',{bubbles:true}));
    await sleep(100);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(saved.classes[0].children[1].reportStatus!=='submitted') throw new Error('second child report handler failed');

    const classCode=saved.classes[0].code;
    for(const name of ['Join A.','Join B.']){
      d.getElementById('joinChildName').value=name;
      d.getElementById('joinClassCode').value=classCode;
      d.getElementById('sendJoinRequestBtn').click();
      await sleep(50);
    }
    const acceptButtons=[...d.querySelectorAll('[data-join-accept]')];
    if(acceptButtons.length!==2) throw new Error('two join requests not rendered');
    acceptButtons[1].click();
    await sleep(100);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(saved.joinRequests.filter(x=>x.status==='accepted').length!==1) throw new Error('second join request handler failed');

    const payload={format:'aktywnik-plus-backup',version:3,data:saved};
    const restored=w.safeBackupState(payload);
    if(restored.entries?.length!==2 || restored.pilot?.childDisplayName!=='Test D.') throw new Error('backup validation failed');

    const malformed=w.safeBackupState({format:'aktywnik-plus-backup',data:{entries:[
      {id:'bad',date:'not-a-date',activity:'Spacer',minutes:20,status:'approved'},
      {id:'huge',date:'2030-01-01',activity:'Spacer',minutes:99999,status:'approved'},
      {id:'ok',date:'2026-10-01',activity:'Spacer',minutes:30,effort:2,status:'approved'}
    ]}});
    if(malformed.entries.length!==2) throw new Error('malformed backup filtering failed');
    if(malformed.entries.find(x=>x.id==='huge')?.minutes!==600) throw new Error('backup minute clamp failed');

    const futureState=JSON.parse(localStorage.getItem(KEY)||'{}');
    futureState.entries.unshift({id:'future-test',date:'2030-01-01',activity:'Spacer',minutes:60,effort:2,note:'',status:'approved',createdAt:new Date().toISOString()});
    localStorage.setItem(KEY,JSON.stringify(futureState));
    ({w,d}=await loadApp('future-report'));
    if(w.stats('year').es.some(x=>x.id==='future-test')) throw new Error('future entry included in report');
    futureState.entries=futureState.entries.filter(x=>x.id!=='future-test');
    localStorage.setItem(KEY,JSON.stringify(futureState));

    if(!skipPwaChecks){
      if(!('serviceWorker' in navigator)) throw new Error('service worker API unavailable');
      let regs=[];
      for(let i=0;i<30;i++){
        regs=await navigator.serviceWorker.getRegistrations();
        if(regs.length) break;
        await sleep(100);
      }
      if(!regs.length) throw new Error('service worker not registered');

      let cacheNames=[];
      for(let i=0;i<30;i++){
        cacheNames=await caches.keys();
        if(cacheNames.some(n=>n.startsWith('aktywnik-plus-'))) break;
        await sleep(100);
      }
      if(!cacheNames.some(n=>n.startsWith('aktywnik-plus-'))) throw new Error('PWA cache missing');
    }

    const manifest=await fetch('../manifest.webmanifest').then(r=>r.json());
    if(manifest.start_url!=='./app.html') throw new Error('manifest start_url invalid');
    if(!Array.isArray(manifest.icons) || manifest.icons.length<2) throw new Error('manifest icons missing');

    ({w,d}=await loadApp('reload'));
    const persisted=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(persisted.entries?.length!==2 || persisted.entries.some(e=>e.status!=='approved')) throw new Error('data did not persist after reload');
    if(persisted.pilot?.childDisplayName!=='Test D.') throw new Error('pilot name did not persist');
    if(!d.getElementById('childDisplayName').textContent.includes('Test D.')) throw new Error('reloaded UI did not restore pilot name');

    pass(skipPwaChecks?'pilot, timer, validation, manual activity, approval, report, multi-item class handlers, backup, manifest and persistence':'pilot, timer, manual activity, approval, report, multi-item class handlers, backup, service worker, cache, manifest and persistence');
    localStorage.removeItem(KEY);
  }catch(e){
    fail(e.message);
  }
}
run();
</script>
</body>
</html>
