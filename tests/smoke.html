<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Aktywnik+ smoke 0.4.0</title>
<style>body{font-family:system-ui;margin:20px}#result{padding:12px;border:1px solid #ccc}.pass{background:#e8fff0}.fail{background:#ffecec}iframe{width:100%;height:900px;border:1px solid #ddd;margin-top:12px}</style>
</head>
<body>
<div id="result">RUNNING</div>
<iframe id="appFrame" src="../app.html"></iframe>
<script>
const KEY='aktywnik-plus-data-v1';
const DRAFT_KEY='aktywnik-plus-entry-draft-v1';
const SESSION_KEY='aktywnik-plus-parent-unlocked-until';
const result=document.getElementById('result');
function fail(msg){result.className='fail';result.textContent='FAIL: '+msg;document.body.dataset.test='fail'}
function pass(msg){result.className='pass';result.textContent='PASS: '+msg;document.body.dataset.test='pass'}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function loadApp(label){
  const f=document.getElementById('appFrame'),token=label+'-'+Date.now(),target=new URL('../app.html?smoke='+token,location.href).href;
  await new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('app load timeout: '+token)),5000);
    const done=()=>{
      try{
        const current=f.contentWindow.location.href;
        if(current!==target||f.contentDocument.readyState!=='complete')return;
        clearTimeout(timer);f.removeEventListener('load',done);resolve();
      }catch{}
    };
    f.addEventListener('load',done);
    f.src=target;
    done();
  });
  await sleep(120);
  return {w:f.contentWindow,d:f.contentDocument};
}
async function run(){
  try{
    Object.keys(localStorage).filter(k=>k===DRAFT_KEY||k.startsWith(DRAFT_KEY+':')).forEach(k=>localStorage.removeItem(k));localStorage.removeItem(KEY);sessionStorage.clear();
    let ctx=await loadApp('initial'),w=ctx.w,d=ctx.d;
    if(d.getElementById('pilotSetupCard').classList.contains('hidden'))throw new Error('initial universal setup missing');
    if(d.getElementById('childModeBtn')||d.getElementById('parentModeBtn')||d.getElementById('schoolModeBtn'))throw new Error('legacy role switch still visible');
    if(!d.getElementById('parentPinSetup')||!d.getElementById('parentPinConfirm'))throw new Error('PIN setup controls missing');
    if(!d.getElementById('setupMode')||!d.getElementById('customActivityName')||!d.getElementById('selfDataCard'))throw new Error('0.4.0 universal UI missing');
    if(!d.getElementById('saveStatusBadge')||!d.getElementById('childWeekSnapshot')||!d.getElementById('repeatLastActivityBtn')||!d.getElementById('entryDraftStatus'))throw new Error('daily overview UI missing');

    d.getElementById('setupMode').value='self';
    d.getElementById('setupMode').dispatchEvent(new w.Event('change',{bubbles:true}));
    d.getElementById('pilotChildName').value='Tester';
    d.getElementById('startPilotBtn').click();
    await sleep(120);
    let selfSaved=JSON.parse(localStorage.getItem(KEY)||'{}');
    const selfDraftKey=DRAFT_KEY+':'+selfSaved.children?.[0]?.id;
    if(selfSaved.profileMode!=='self'||selfSaved.children?.[0]?.requireParentApproval!==false)throw new Error('self mode setup failed');
    if(!d.getElementById('parentAccessBtn').classList.contains('hidden'))throw new Error('parent access visible in self mode');
    if(d.getElementById('selfDataCard').classList.contains('hidden'))throw new Error('self data card missing');
    let custom=[...d.querySelectorAll('.activity')].find(x=>x.textContent.includes('Inna aktywność'));if(!custom)throw new Error('custom activity missing');
    custom.click();
    d.getElementById('customActivityName').value='Prace w ogrodzie';
    d.getElementById('activityDuration').value='12';
    d.getElementById('activityNote').value='draft test';
    for(const id of ['customActivityName','activityDuration','activityNote'])d.getElementById(id).dispatchEvent(new w.Event('input',{bubbles:true}));
    await sleep(50);
    const draftBeforeReload=JSON.parse(localStorage.getItem(selfDraftKey)||'null');
    if(!draftBeforeReload||draftBeforeReload.customName!=='Prace w ogrodzie'||draftBeforeReload.minutes!==12||draftBeforeReload.note!=='draft test')throw new Error('entry draft autosave failed');
    ctx=await loadApp('draft-restore');w=ctx.w;d=ctx.d;await sleep(100);
    if(d.getElementById('entryCard').classList.contains('hidden'))throw new Error('entry draft was not restored');
    if(d.getElementById('customActivityName').value!=='Prace w ogrodzie'||d.getElementById('activityDuration').value!=='12'||d.getElementById('activityNote').value!=='draft test')throw new Error('restored entry draft values mismatch');
    d.getElementById('saveEntryBtn').click();await sleep(80);
    if(localStorage.getItem(selfDraftKey)!==null)throw new Error('entry draft not cleared after save');
    selfSaved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(selfSaved.entries?.[0]?.activity!=='Prace w ogrodzie'||selfSaved.entries?.[0]?.status!=='approved')throw new Error('self custom activity failed');

    Object.keys(localStorage).filter(k=>k===DRAFT_KEY||k.startsWith(DRAFT_KEY+':')).forEach(k=>localStorage.removeItem(k));localStorage.removeItem(KEY);sessionStorage.clear();
    const childA={id:'child-a',displayName:'Dziecko A',favorites:['Spacer','Rower'],requireParentApproval:true,createdAt:new Date().toISOString()};
    const seeded={schemaVersion:6,profileMode:'family',meta:{lastBackupAt:null,lastWriteAt:null},pilot:{started:true},parentAuth:{pinSalt:'test-salt',pinHash:'test-hash',iterations:120000,autoLockMinutes:5},children:[childA],activeChildId:childA.id,activeTimer:null,entries:[],approvalEvents:[],rewards:[],classes:[],joinRequests:[],paperImports:[],reminderHour:19,reminderMinute:30,school:{deploymentModel:'school_saas',mode:'hybrid',requireParentApproval:true,useEffort:true,usePluses:true,gradeRule:'manual',maxCountedMinutes:null}};
    localStorage.setItem(KEY,JSON.stringify(seeded));
    const testToday=new Date().toISOString().slice(0,10);
    localStorage.setItem(DRAFT_KEY,JSON.stringify({version:1,savedAt:new Date().toISOString(),childId:'child-a',selected:'Spacer',date:testToday,minutes:22,effort:2,customName:'',note:'legacy draft'}));
    ctx=await loadApp('seeded');w=ctx.w;d=ctx.d;
    if(d.getElementById('entryCard').classList.contains('hidden')||d.getElementById('activityDuration').value!=='22')throw new Error('legacy entry draft was not restored');
    if(localStorage.getItem(DRAFT_KEY)!==null||!localStorage.getItem(DRAFT_KEY+':child-a'))throw new Error('legacy entry draft migration failed');
    d.getElementById('cancelEntryBtn').click();await sleep(30);
    await w.setParentPin('2468');
    w.persist();
    await sleep(80);
    if(!await w.verifyParentPin('2468'))throw new Error('correct PIN verification failed');
    if(await w.verifyParentPin('1111'))throw new Error('wrong PIN verification succeeded');

    d.getElementById('parentAccessBtn').click();
    d.getElementById('parentPinInput').value='1111';
    await w.unlockParent();
    await sleep(50);
    if(!d.getElementById('parentPanel').classList.contains('hidden'))throw new Error('wrong PIN opened parent zone');
    d.getElementById('parentPinInput').value='2468';
    await w.unlockParent();
    await sleep(70);
    if(d.getElementById('parentPanel').classList.contains('hidden'))throw new Error('correct PIN did not open parent zone');
    w.lockParent();
    await sleep(50);

    if(d.getElementById('childPanel').classList.contains('hidden'))throw new Error('child mode not active');
    if(!d.getElementById('parentPanel').classList.contains('hidden'))throw new Error('parent visible without session');

    w.switchMode('school');
    await sleep(60);
    if(!d.getElementById('schoolPanel').classList.contains('hidden'))throw new Error('school accessible while parent locked');
    if(d.getElementById('parentUnlockDialog').open)d.getElementById('parentUnlockDialog').close();

    let spacer=[...d.querySelectorAll('.activity')].find(x=>x.textContent.includes('Spacer'));
    if(!spacer)throw new Error('activity missing');
    spacer.click();
    const ninety=d.querySelector('[data-duration="90"]');
    if(!ninety)throw new Error('quick duration preset missing');
    ninety.click();
    if(d.getElementById('activityDuration').value!=='90')throw new Error('quick duration preset failed');
    d.getElementById('activityDuration').value='25';d.getElementById('activityNote').value='pierwszy wpis';d.getElementById('saveEntryBtn').click();await sleep(80);
    let saved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(saved.entries?.length!==1||saved.entries[0].status!=='pending'||saved.entries[0].childId!=='child-a')throw new Error('pending child entry failed');

    const editBtn=d.querySelector('[data-child-edit]');if(!editBtn)throw new Error('pending edit button missing');
    editBtn.click();d.getElementById('activityDuration').value='30';d.getElementById('saveEntryBtn').click();await sleep(80);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved.entries[0].minutes!==30)throw new Error('child edit failed');
    if(!saved.meta?.lastWriteAt)throw new Error('local write metadata missing');
    if(!w.recentDuplicate('child-a',{date:saved.entries[0].date,activity:saved.entries[0].activity,minutes:saved.entries[0].minutes,note:saved.entries[0].note}))throw new Error('duplicate guard did not detect recent entry');
    if(!d.getElementById('childWeekSnapshot').textContent.includes('30 min'))throw new Error('weekly child overview missing entry');
    if(d.getElementById('repeatLastActivityBtn').classList.contains('hidden'))throw new Error('repeat last activity action missing');
    d.getElementById('repeatLastActivityBtn').click();await sleep(40);
    if(d.getElementById('activityDuration').value!=='30'||!d.getElementById('selectedActivityTitle').textContent.includes('Spacer'))throw new Error('repeat last activity failed');
    d.getElementById('cancelEntryBtn').click();

    sessionStorage.setItem(SESSION_KEY,String(Date.now()+600000));w.switchMode('parent',true);await sleep(80);
    if(d.getElementById('parentPanel').classList.contains('hidden'))throw new Error('authorized parent session not shown');
    if(!d.getElementById('paperImportCard'))throw new Error('paper OCR import UI missing');
    const parsedImport=w.parseDelimitedImport('Data;Aktywność;Czas;Wysiłek;Uwagi\n2026-10-01;Judo;1,5 h;3;trening');
    if(parsedImport.length!==1||parsedImport[0].minutes!==90||parsedImport[0].activity!=='Judo')throw new Error('paper OCR parser failed');
    d.getElementById('parentAutoLockMinutes').value='10';
    d.getElementById('saveAutoLockBtn').click();
    await sleep(60);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(saved.parentAuth?.autoLockMinutes!==10)throw new Error('auto-lock setting not saved');

    d.getElementById('newChildName').value='Dziecko B';d.getElementById('addChildBtn').click();await sleep(80);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved.children?.length!==2)throw new Error('second child not added');
    const childB=saved.children.find(x=>x.displayName==='Dziecko B');if(!childB)throw new Error('second child missing');

    d.getElementById('parentChildSelect').value='child-a';d.getElementById('parentChildSelect').dispatchEvent(new w.Event('change',{bubbles:true}));await sleep(50);
    const correct=d.querySelector('[data-correct]');if(!correct)throw new Error('parent correct action missing');
    correct.click();d.getElementById('parentEditMinutes').value='35';d.getElementById('saveParentCorrectionBtn').click();await sleep(80);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');const first=saved.entries.find(x=>x.childId==='child-a');
    if(first.status!=='approved'||first.minutes!==35||!first.correctedByParent)throw new Error('parent correction failed');
    if(!d.getElementById('parentSnapshot').textContent.includes('35 min'))throw new Error('parent quick snapshot missing approved activity');
    d.getElementById('parentReportMonth').value='2026-10';d.getElementById('parentReportMonth').dispatchEvent(new w.Event('change',{bubbles:true}));await sleep(60);
    if(!d.getElementById('parentReport').textContent.includes('35 min'))throw new Error('selected-month report missing approved entry');
    const printPages=w.buildSchoolPrintPages('child-a',new w.Date('2026-10-15T12:00:00'));
    if(printPages.length!==2||printPages[0].rows[0].entry?.minutes!==35||printPages[0].rows.length!==35)throw new Error('A4 monthly report pagination failed');

    const childADraftKey=DRAFT_KEY+':child-a',childBDraftKey=DRAFT_KEY+':'+childB.id;
    localStorage.setItem(childADraftKey,JSON.stringify({version:1,savedAt:new Date().toISOString(),childId:'child-a',selected:'Rower',date:testToday,minutes:33,effort:2,customName:'',note:'draft A'}));
    localStorage.setItem(childBDraftKey,JSON.stringify({version:1,savedAt:new Date().toISOString(),childId:childB.id,selected:'Spacer',date:testToday,minutes:44,effort:3,customName:'',note:'draft B'}));
    d.getElementById('parentChildSelect').value=childB.id;d.getElementById('parentChildSelect').dispatchEvent(new w.Event('change',{bubbles:true}));d.getElementById('setDeviceChildBtn').click();await sleep(70);
    d.getElementById('lockParentBtn').click();await sleep(70);
    if(!d.getElementById('parentPanel').classList.contains('hidden'))throw new Error('parent did not lock');
    if(!d.getElementById('childDisplayName').textContent.includes('Dziecko B'))throw new Error('device child switch failed');
    if(d.getElementById('childEntries').textContent.includes('pierwszy wpis'))throw new Error('sibling data leaked');
    if(d.getElementById('entryCard').classList.contains('hidden')||d.getElementById('activityDuration').value!=='44'||d.getElementById('activityNote').value!=='draft B')throw new Error('child-specific draft was not restored');
    if(!localStorage.getItem(childADraftKey))throw new Error('switching profiles removed another child draft');
    d.getElementById('cancelEntryBtn').click();await sleep(30);
    if(localStorage.getItem(childBDraftKey)!==null)throw new Error('cancel did not clear active child draft');
    localStorage.removeItem(childADraftKey);

    spacer=[...d.querySelectorAll('.activity')].find(x=>x.textContent.includes('Spacer'));spacer.click();d.getElementById('activityDuration').value='18';d.getElementById('activityNote').value='do odrzucenia';d.getElementById('saveEntryBtn').click();await sleep(70);
    sessionStorage.setItem(SESSION_KEY,String(Date.now()+600000));w.switchMode('parent',true);await sleep(70);
    const reject=d.querySelector('[data-reject]');if(!reject)throw new Error('reject action missing');
    reject.click();d.getElementById('rejectReason').value='Popraw czas';d.getElementById('rejectNote').value='sprawdź';d.getElementById('confirmRejectBtn').click();await sleep(80);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');const rejected=saved.entries.find(x=>x.childId===childB.id&&x.note==='do odrzucenia');
    if(!rejected||rejected.status!=='rejected'||!rejected.rejectionReason.includes('Popraw czas'))throw new Error('reject reason failed');
    if(!saved.approvalEvents?.some(x=>x.entryId===rejected.id&&x.action==='rejected'))throw new Error('approval audit missing');

    d.getElementById('openSchoolDemoBtn').click();await sleep(60);if(d.getElementById('schoolPanel').classList.contains('hidden'))throw new Error('school demo unavailable to unlocked parent');
    d.getElementById('schoolExitBtn').click();d.getElementById('lockParentBtn').click();await sleep(50);w.switchMode('school');await sleep(50);
    if(!d.getElementById('schoolPanel').classList.contains('hidden'))throw new Error('school accessible after relock');

    const migrated=w.safeBackupState({pilot:{started:true,childDisplayName:'Stare dziecko'},favorites:['Spacer'],entries:[{id:'legacy',date:'2026-10-01',activity:'Spacer',minutes:20,effort:2,status:'approved'}]});
    if(migrated.children.length!==1||migrated.entries[0].childId!==migrated.children[0].id)throw new Error('legacy migration failed');
    const restored=w.safeBackupState({format:'aktywnik-plus-backup',version:6,data:{...saved,meta:{lastBackupAt:'2026-10-02T10:00:00.000Z',lastWriteAt:'2026-10-02T10:05:00.000Z'}}});if(restored.children.length!==2)throw new Error('multi-child backup failed');
    if(restored.schemaVersion!==6||restored.profileMode!=='family'||!restored.meta.lastBackupAt||!restored.meta.lastWriteAt)throw new Error('backup metadata migration failed');

    const purgeState=JSON.parse(localStorage.getItem(KEY)||'{}');
    purgeState.classes=[{id:'class-purge',name:'TEST',children:[{id:'row',familyChildId:'purge-child',name:'Purge'}]}];
    purgeState.paperImports=[{id:'import-purge',familyChildId:'purge-child',rows:[]}];
    purgeState.entries.push({id:'entry-purge',childId:'purge-child',date:'2026-10-01',activity:'Spacer',minutes:10,status:'approved'});
    w.purgeChildLocalData('purge-child',purgeState);
    if(purgeState.entries.some(x=>x.childId==='purge-child')||purgeState.classes[0].children.length||purgeState.paperImports.length)throw new Error('cascade purge failed');

    w.clearPinFailures();
    for(let i=0;i<5;i++)w.registerPinFailure();
    if(w.pinLockRemainingMs()<=0)throw new Error('PIN lockout failed');
    w.clearPinFailures();
    if(w.pinLockRemainingMs()>0)throw new Error('PIN lockout reset failed');

    pass('universal modes, per-profile entry draft recovery, legacy draft migration, data controls, family PIN roles, multi-child isolation, reports, audit, migration, backup and PWA');
  }catch(err){fail(err.message||String(err))}
}
run();
</script>
</body>
</html>
