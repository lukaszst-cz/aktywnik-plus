<body>
<div id="result">RUNNING</div>
<iframe id="appFrame" src="../app.html"></iframe>
<script>
const KEY='aktywnik-plus-data-v1';
const DRAFT_KEY='aktywnik-plus-entry-draft-v1';
const SYNC_KEY='aktywnik-plus-sync-outbox-v1';
const DELETE_KEY='aktywnik-plus-personal-deletes-v1';
const LAST_SYNC_KEY='aktywnik-plus-last-cloud-sync-v1';
const FAMILY_SYNC_KEY='aktywnik-plus-family-sync-outbox-v1';
const FAMILY_LAST_SYNC_KEY='aktywnik-plus-last-family-cloud-sync-v1';
const FAMILY_DELETE_KEY='aktywnik-plus-family-deletes-v1';
const CLOUD_SESSION_KEY='aktywnik-plus-cloud-session-v1';
const SESSION_KEY='aktywnik-plus-parent-unlocked-until';
const PIN_FAIL_KEY='aktywnik-plus-parent-pin-fails';
const PIN_LOCK_KEY='aktywnik-plus-parent-pin-lock-until';
const LANG_KEY='aktywnik_plus_lang';
const result=document.getElementById('result');
function fail(msg){result.className='fail';result.textContent='FAIL: '+msg;document.body.dataset.test='fail'}
function pass(msg){result.className='pass';result.textContent='PASS: '+msg;document.body.dataset.test='pass'}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function loadApp(label){
  const f=document.getElementById('appFrame'),token=label+'-'+Date.now(),target=new URL('../app.html?smoke='+token,location.href).href;
  await new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('app load timeout: '+token)),5000);
    const done=()=>{
      try{
        const current=f.contentWindow.location.href;
        if(current!==target||f.contentDocument.readyState!=='complete')return;
        clearTimeout(timer);f.removeEventListener('load',done);resolve();
      }catch{}
    };
    f.addEventListener('load',done);
    f.src=target;
    done();
  });
  await sleep(120);
  return {w:f.contentWindow,d:f.contentDocument};
}
async function run(){
  try{
    Object.keys(localStorage).filter(k=>k===DRAFT_KEY||k.startsWith(DRAFT_KEY+':')).forEach(k=>localStorage.removeItem(k));localStorage.removeItem(KEY);localStorage.removeItem(FAMILY_SYNC_KEY);localStorage.removeItem(FAMILY_LAST_SYNC_KEY);localStorage.removeItem(FAMILY_DELETE_KEY);sessionStorage.clear();
    let ctx=await loadApp('initial'),w=ctx.w,d=ctx.d;
    if(d.getElementById('pilotSetupCard').classList.contains('hidden'))throw new Error('initial universal setup missing');
    if(d.getElementById('childModeBtn')||d.getElementById('parentModeBtn')||d.getElementById('schoolModeBtn'))throw new Error('legacy role switch still visible');
    if(!d.getElementById('parentPinSetup')||!d.getElementById('parentPinConfirm'))throw new Error('PIN setup controls missing');
    if(!d.getElementById('setupMode')||!d.getElementById('customActivityName')||!d.getElementById('selfDataCard'))throw new Error('0.4.0 universal UI missing');
    if(!d.getElementById('saveStatusBadge')||!d.getElementById('childWeekSnapshot')||!d.getElementById('repeatLastActivityBtn')||!d.getElementById('entryDraftStatus'))throw new Error('daily overview UI missing');

    d.getElementById('setupMode').value='self';
    d.getElementById('setupMode').dispatchEvent(new w.Event('change',{bubbles:true}));
    d.getElementById('pilotChildName').value='Tester';
    d.getElementById('startPilotBtn').click();
    await sleep(120);
    let selfSaved=JSON.parse(localStorage.getItem(KEY)||'{}');
    const selfDraftKey=DRAFT_KEY+':'+selfSaved.children?.[0]?.id;
    if(selfSaved.profileMode!=='self'||selfSaved.children?.[0]?.requireParentApproval!==false)throw new Error('self mode setup failed');
    if(!d.getElementById('parentAccessBtn').classList.contains('hidden'))throw new Error('parent access visible in self mode');
    if(d.getElementById('selfDataCard').classList.contains('hidden'))throw new Error('self data card missing');
    let custom=[...d.querySelectorAll('.activity')].find(x=>x.textContent.includes('Inna aktywność'));if(!custom)throw new Error('custom activity missing');
    custom.click();
    d.getElementById('customActivityName').value='Prace w ogrodzie';
    d.getElementById('activityDuration').value='12';
    d.getElementById('activityNote').value='draft test';
    for(const id of ['customActivityName','activityDuration','activityNote'])d.getElementById(id).dispatchEvent(new w.Event('input',{bubbles:true}));
    await sleep(50);
    const draftBeforeReload=JSON.parse(localStorage.getItem(selfDraftKey)||'null');
    if(!draftBeforeReload||draftBeforeReload.customName!=='Prace w ogrodzie'||draftBeforeReload.minutes!==12||draftBeforeReload.note!=='draft test')throw new Error('entry draft autosave failed');
    ctx=await loadApp('draft-restore');w=ctx.w;d=ctx.d;await sleep(100);
    if(d.getElementById('entryCard').classList.contains('hidden'))throw new Error('entry draft was not restored');
    if(d.getElementById('customActivityName').value!=='Prace w ogrodzie'||d.getElementById('activityDuration').value!=='12'||d.getElementById('activityNote').value!=='draft test')throw new Error('restored entry draft values mismatch');
    d.getElementById('saveEntryBtn').click();await sleep(80);
    if(localStorage.getItem(selfDraftKey)!==null)throw new Error('entry draft not cleared after save');
    selfSaved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(selfSaved.entries?.[0]?.activity!=='Prace w ogrodzie'||selfSaved.entries?.[0]?.status!=='approved')throw new Error('self custom activity failed');
    const localDeleteId=selfSaved.entries[0].id;
    const deleteBtn=d.querySelector('[data-self-delete="'+localDeleteId+'"]');
    if(!deleteBtn)throw new Error('self delete action missing');
    w.confirm=()=>true;deleteBtn.click();await sleep(60);
    selfSaved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(selfSaved.entries?.some(e=>e.id===localDeleteId))throw new Error('self delete did not remove local entry');
    const queuedDeletes=JSON.parse(localStorage.getItem('aktywnik-plus-personal-deletes-v1')||'{}');
    if(!queuedDeletes[localDeleteId])throw new Error('self delete tombstone not queued');

    const cloudBridge=w.AktywnikCloudBridge;
    if(!cloudBridge?.mergePersonalEntries)throw new Error('personal cloud merge bridge missing');
    const remoteId='33333333-3333-4333-8333-333333333333';
    const syncDay=new Date().toISOString().slice(0,10),syncBase=Date.now();
    let mergeResult=cloudBridge.mergePersonalEntries([{
      client_entry_id:remoteId,activity_date:syncDay,activity_type:'Rower',minutes:44,effort:3,note:'cloud test',
      source:'manual',client_updated_at:new Date(syncBase+1000).toISOString(),updated_at:new Date(syncBase+1000).toISOString()
    }]);
    if(mergeResult.added!==1)throw new Error('cloud pull did not add missing personal entry');
    let mergedState=JSON.parse(localStorage.getItem(KEY)||'{}'),mergedEntry=mergedState.entries?.find(e=>e.id===remoteId);
    if(!mergedEntry||mergedEntry.minutes!==44||mergedEntry.status!=='approved')throw new Error('cloud-added entry mismatch');

    mergeResult=cloudBridge.mergePersonalEntries([{
      client_entry_id:remoteId,activity_date:syncDay,activity_type:'Rower',minutes:10,effort:1,note:'older cloud',
      source:'manual',client_updated_at:new Date(syncBase-1000).toISOString(),updated_at:new Date(syncBase-1000).toISOString()
    }]);
    if(mergeResult.localNewer!==1)throw new Error('older cloud version did not preserve local entry');
    mergedState=JSON.parse(localStorage.getItem(KEY)||'{}');mergedEntry=mergedState.entries?.find(e=>e.id===remoteId);
    if(mergedEntry?.minutes!==44)throw new Error('older cloud version overwrote newer local entry');

    mergeResult=cloudBridge.mergePersonalEntries([{
      client_entry_id:remoteId,activity_date:syncDay,activity_type:'Rower',minutes:50,effort:4,note:'newer cloud',
      source:'manual',client_updated_at:new Date(syncBase+3000).toISOString(),updated_at:new Date(syncBase+3000).toISOString()
    }]);
    if(mergeResult.updated!==1)throw new Error('newer cloud version did not update local entry');
    mergedState=JSON.parse(localStorage.getItem(KEY)||'{}');mergedEntry=mergedState.entries?.find(e=>e.id===remoteId);
    if(mergedEntry?.minutes!==50||mergedEntry?.effort!==4)throw new Error('newer cloud merge mismatch');

    const deleteResult=cloudBridge.mergePersonalCloudState([], [{
      client_entry_id:remoteId,
      deleted_at:new Date(syncBase+4000).toISOString()
    }]);
    if(deleteResult.deleted!==1)throw new Error('cloud tombstone did not delete local entry');
    mergedState=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(mergedState.entries?.some(e=>e.id===remoteId))throw new Error('cloud-deleted entry still present locally');

    mergeResult=cloudBridge.mergePersonalEntries([{
      client_entry_id:remoteId,activity_date:syncDay,activity_type:'Rower',minutes:55,effort:5,note:'newer than delete',
      source:'manual',client_updated_at:new Date(syncBase+6000).toISOString(),updated_at:new Date(syncBase+6000).toISOString()
    }]);
    if(mergeResult.added!==1)throw new Error('newer post-delete cloud entry did not restore');
    const staleDelete=cloudBridge.mergePersonalCloudState([], [{
      client_entry_id:remoteId,
      deleted_at:new Date(syncBase+5000).toISOString()
    }]);
    if(staleDelete.deleted!==0)throw new Error('stale tombstone deleted newer local entry');

    Object.keys(localStorage).filter(k=>k===DRAFT_KEY||k.startsWith(DRAFT_KEY+':')).forEach(k=>localStorage.removeItem(k));localStorage.removeItem(KEY);localStorage.removeItem(SYNC_KEY);localStorage.removeItem(DELETE_KEY);sessionStorage.clear();
    const childA={id:'child-a',displayName:'Dziecko A',favorites:['Spacer','Rower'],requireParentApproval:true,createdAt:new Date().toISOString()};
    const seeded={schemaVersion:6,profileMode:'family',meta:{lastBackupAt:null,lastWriteAt:null},pilot:{started:true},parentAuth:{pinSalt:'test-salt',pinHash:'test-hash',iterations:120000,autoLockMinutes:5},children:[childA],activeChildId:childA.id,activeTimer:null,entries:[],approvalEvents:[],rewards:[],classes:[],joinRequests:[],paperImports:[],reminderHour:19,reminderMinute:30,school:{deploymentModel:'school_saas',mode:'hybrid',requireParentApproval:true,useEffort:true,usePluses:true,gradeRule:'manual',maxCountedMinutes:null}};
    localStorage.setItem(KEY,JSON.stringify(seeded));
    const testToday=new Date().toISOString().slice(0,10);
    localStorage.setItem(DRAFT_KEY,JSON.stringify({version:1,savedAt:new Date().toISOString(),childId:'child-a',selected:'Spacer',date:testToday,minutes:22,effort:2,customName:'',note:'legacy draft'}));
    ctx=await loadApp('seeded');w=ctx.w;d=ctx.d;
    if(d.getElementById('entryCard').classList.contains('hidden')||d.getElementById('activityDuration').value!=='22')throw new Error('legacy entry draft was not restored');
    if(localStorage.getItem(DRAFT_KEY)!==null||!localStorage.getItem(DRAFT_KEY+':child-a'))throw new Error('legacy entry draft migration failed');
    d.getElementById('cancelEntryBtn').click();await sleep(30);
    if(!w.AktywnikSync)throw new Error('sync client missing');
    if(w.AktywnikSync.protocolVersion!==1)throw new Error('sync protocol version missing');
    const familySyncStatus=d.getElementById('cloudSyncBadge').textContent.toLowerCase();
    if(!familySyncStatus.includes('rodzina')&&!familySyncStatus.includes('family'))throw new Error('family local-only sync status missing');
    w.AktywnikSync.markDirty(seeded);
    if(localStorage.getItem(SYNC_KEY)!==null)throw new Error('family state entered personal sync outbox');
    w.AktywnikSync.markDeleted('44444444-4444-4444-8444-444444444444');
    if(localStorage.getItem(DELETE_KEY)!==null)throw new Error('family delete entered personal delete queue');
    localStorage.setItem(SYNC_KEY,JSON.stringify({dirty:true,updatedAt:new Date().toISOString(),attempts:0,lastError:null,snapshot:seeded}));
    if(await w.AktywnikSync.flush()!==true||localStorage.getItem(SYNC_KEY)!==null)throw new Error('legacy family sync outbox was not cleared safely');

    const personalEntry={
      id:'12121212-1212-4121-8121-121212121212',
      childId:'private-local-child',
      date:testToday,
      activity:'Spacer',
      minutes:30,
      effort:2,
      note:'sync only this',
      status:'approved',
      source:'manual',
      createdAt:new Date().toISOString(),
      rejectionReason:'private-local-status'
    };
    const personalState={
      ...seeded,
      profileMode:'self',
      parentAuth:{pinSalt:'private-salt',pinHash:'private-hash',iterations:120000,autoLockMinutes:5},
      children:[{...childA,id:'private-local-child',displayName:'Private local profile'}],
      activeChildId:'private-local-child',
      entries:[personalEntry],
      school:{...seeded.school,privateLocalSetting:'do-not-sync'}
    };
    localStorage.setItem(KEY,JSON.stringify(personalState));
    w.AktywnikSync.markDirty(personalState);
    let minimalQueue=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');
    if(!minimalQueue?.dirty||minimalQueue.snapshot?.profileMode!=='self'||minimalQueue.snapshot?.entries?.length!==1)throw new Error('minimal personal sync outbox missing');
    const minimalSerialized=JSON.stringify(minimalQueue);
    for(const forbidden of ['parentAuth','private-hash','children','activeChildId','school','childId','status','rejectionReason','privateLocalSetting']){
      if(minimalSerialized.includes(forbidden))throw new Error('personal sync outbox leaked local-only field: '+forbidden);
    }
    localStorage.setItem(SYNC_KEY,JSON.stringify({
      dirty:true,
      updatedAt:new Date().toISOString(),
      attempts:2,
      lastError:'legacy',
      secretTopLevel:'remove-me',
      snapshot:personalState
    }));
    minimalQueue=w.AktywnikSync.scrubStoredOutbox();
    const scrubbedSerialized=JSON.stringify(minimalQueue);
    if(scrubbedSerialized.includes('secretTopLevel')||scrubbedSerialized.includes('private-hash')||scrubbedSerialized.includes('parentAuth')||scrubbedSerialized.includes('children'))throw new Error('legacy personal outbox was not scrubbed');
    localStorage.removeItem(SYNC_KEY);
    localStorage.setItem(KEY,JSON.stringify(seeded));

    await w.setParentPin('2468');
    w.persist();
    await sleep(80);
    if(localStorage.getItem(SYNC_KEY)!==null)throw new Error('family persist recreated personal sync outbox');
    if(!await w.verifyParentPin('2468'))throw new Error('correct PIN verification failed');
    if(await w.verifyParentPin('1111'))throw new Error('wrong PIN verification succeeded');

    d.getElementById('parentAccessBtn').click();
    d.getElementById('parentPinInput').value='1111';
    await w.unlockParent();
    await sleep(50);
    if(!d.getElementById('parentPanel').classList.contains('hidden'))throw new Error('wrong PIN opened parent zone');
    d.getElementById('parentPinInput').value='2468';
    await w.unlockParent();
    await sleep(70);
    if(d.getElementById('parentPanel').classList.contains('hidden'))throw new Error('correct PIN did not open parent zone');
    w.lockParent();
    await sleep(50);

    if(d.getElementById('childPanel').classList.contains('hidden'))throw new Error('child mode not active');
    if(!d.getElementById('parentPanel').classList.contains('hidden'))throw new Error('parent visible without session');

    w.switchMode('school');
    await sleep(60);
    if(!d.getElementById('schoolPanel').classList.contains('hidden'))throw new Error('school accessible while parent locked');
    if(d.getElementById('parentUnlockDialog').open)d.getElementById('parentUnlockDialog').close();

    let spacer=[...d.querySelectorAll('.activity')].find(x=>x.textContent.includes('Spacer'));
    if(!spacer)throw new Error('activity missing');
    spacer.click();
    const ninety=d.querySelector('[data-duration="90"]');
    if(!ninety)throw new Error('quick duration preset missing');
    ninety.click();
    if(d.getElementById('activityDuration').value!=='90')throw new Error('quick duration preset failed');
    try{w.setQuickDuration(45)}catch(e){throw new Error('quick duration handler threw: '+(e?.message||e))}
    if(d.getElementById('activityDuration').value!=='45')throw new Error('direct quick duration handler failed');
    d.getElementById('activityDuration').value='25';d.getElementById('activityNote').value='pierwszy wpis';d.getElementById('saveEntryBtn').click();await sleep(80);
    let saved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(saved.entries?.length!==1||saved.entries[0].status!=='pending'||saved.entries[0].childId!=='child-a')throw new Error('pending child entry failed');
    spacer=[...d.querySelectorAll('.activity')].find(x=>x.textContent.includes('Spacer'));spacer.click();await sleep(30);
    if(d.getElementById('activityDuration').value!=='25')throw new Error('smart duration did not reuse last matching duration');
    if(!d.getElementById('durationSuggestionHint').textContent.includes('25 min'))throw new Error('smart duration hint missing');
    d.getElementById('cancelEntryBtn').click();

    const editBtn=d.querySelector('[data-child-edit]');if(!editBtn)throw new Error('pending edit button missing');
    editBtn.click();d.getElementById('activityDuration').value='30';d.getElementById('saveEntryBtn').click();await sleep(80);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved.entries[0].minutes!==30)throw new Error('child edit failed');
    if(!saved.meta?.lastWriteAt)throw new Error('local write metadata missing');
    if(!w.recentDuplicate('child-a',{date:saved.entries[0].date,activity:saved.entries[0].activity,minutes:saved.entries[0].minutes,note:saved.entries[0].note}))throw new Error('duplicate guard did not detect recent entry');
    if(!d.getElementById('childWeekSnapshot').textContent.includes('30 min'))throw new Error('weekly child overview missing entry');
    if(d.getElementById('repeatLastActivityBtn').classList.contains('hidden'))throw new Error('repeat last activity action missing');
    d.getElementById('repeatLastActivityBtn').click();await sleep(40);
    if(d.getElementById('activityDuration').value!=='30'||!d.getElementById('selectedActivityTitle').textContent.includes('Spacer'))throw new Error('repeat last activity failed');
    d.getElementById('cancelEntryBtn').click();
    if(d.getElementById('quickStartLastActivityBtn').classList.contains('hidden'))throw new Error('quick start last action missing');
    d.getElementById('quickStartLastActivityBtn').click();await sleep(60);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(saved.activeTimer?.activity!=='Spacer'||saved.activeTimer?.childId!=='child-a')throw new Error('quick start last failed');
    w.confirm=()=>true;w.cancelActivityTimer();await sleep(60);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(saved.activeTimer)throw new Error('quick-start timer cancel failed');

    sessionStorage.setItem(SESSION_KEY,String(Date.now()+600000));w.switchMode('parent',true);await sleep(80);
    if(d.getElementById('parentPanel').classList.contains('hidden'))throw new Error('authorized parent session not shown');
    if(!d.getElementById('paperImportCard'))throw new Error('paper OCR import UI missing');
    const parsedImport=w.parseDelimitedImport('Data;Aktywność;Czas;Wysiłek;Uwagi\n2026-10-01;Judo;1,5 h;3;trening');
    if(parsedImport.length!==1||parsedImport[0].minutes!==90||parsedImport[0].activity!=='Judo')throw new Error('paper OCR parser failed');
    d.getElementById('parentAutoLockMinutes').value='10';
    d.getElementById('saveAutoLockBtn').click();
    await sleep(60);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(saved.parentAuth?.autoLockMinutes!==10)throw new Error('auto-lock setting not saved');

    d.getElementById('newChildName').value='Dziecko B';d.getElementById('addChildBtn').click();await sleep(80);
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved.children?.length!==2)throw new Error('second child not added');
    const childB=saved.children.find(x=>x.displayName==='Dziecko B');if(!childB)throw new Error('second child missing');
    if(!d.getElementById('familyCloudChildSelect')||!w.AktywnikFamilyCloudLink)throw new Error('family cloud link foundation missing');

    const cloudA='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1',cloudB='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb2';
    const originalFamilyFetch=w.fetch;
    const originalValidSession=w.AktywnikAuth.validSession;
    w.AktywnikAuth.validSession=async()=>({access_token:'family-link-test-token'});
    w.fetch=async(url,options={})=>{
      const target=String(url);
      if(target.includes('/api/v1/me'))return new w.Response(JSON.stringify({
        ok:true,
        profile:{id:'11111111-1111-4111-8111-111111111111',display_name:'Rodzic Test',profile_type:'adult'},
        memberships:[],
        children:[
          {id:cloudA,display_name:'Cloud A'},
          {id:cloudB,display_name:'Cloud B'}
        ]
      }),{status:200,headers:{'Content-Type':'application/json'}});
      return originalFamilyFetch(url,options);
    };
    if(!await w.AktywnikFamilyCloudLink.refresh())throw new Error('family cloud children refresh failed');
    d.getElementById('parentChildSelect').value='child-a';
    d.getElementById('parentChildSelect').dispatchEvent(new w.Event('change',{bubbles:true}));
    await sleep(40);
    d.getElementById('familyCloudChildSelect').value=cloudA;
    if(!w.AktywnikFamilyCloudLink.link())throw new Error('family cloud child A link failed');
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(saved.children.find(x=>x.id==='child-a')?.cloudChildId!==cloudA)throw new Error('family cloud child A link not persisted');

    d.getElementById('parentChildSelect').value=childB.id;
    d.getElementById('parentChildSelect').dispatchEvent(new w.Event('change',{bubbles:true}));
    await sleep(40);
    if([...d.getElementById('familyCloudChildSelect').options].some(o=>o.value===cloudA))throw new Error('cloud child already linked to sibling remained selectable');
    d.getElementById('familyCloudChildSelect').value=cloudB;
    if(!w.AktywnikFamilyCloudLink.link())throw new Error('family cloud child B link failed');
    saved=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(saved.children.find(x=>x.id===childB.id)?.cloudChildId!==cloudB)throw new Error('family cloud child B link not persisted');

    if(!w.AktywnikFamilySync?.minimalFamilySnapshot)throw new Error('family sync client missing');
    const familySnapshot=w.AktywnikFamilySync.minimalFamilySnapshot(saved);
    if(familySnapshot?.profileMode!=='family'||familySnapshot?.groups?.length!==2)throw new Error('family sync snapshot missing linked children');
    const groupA=familySnapshot.groups.find(g=>g.localChildId==='child-a'&&g.cloudChildId===cloudA);
    const groupB=familySnapshot.groups.find(g=>g.localChildId===childB.id&&g.cloudChildId===cloudB);
    if(!groupA||!groupB)throw new Error('family sync child mapping mismatch');
    if(groupA.entries?.length!==1||groupB.entries?.length!==0)throw new Error('family sync included wrong child entries');
    const familySnapshotText=JSON.stringify(familySnapshot);
    for(const forbidden of ['parentAuth','pinHash','classes','school','approvalEvents','rewards','paperImports']){
      if(familySnapshotText.includes(forbidden))throw new Error('family sync snapshot leaked local-only field: '+forbidden);
    }
    w.AktywnikFamilySync.markDirty(saved);
    const familyOutbox=JSON.parse(localStorage.getItem(FAMILY_SYNC_KEY)||'null');
    if(!familyOutbox?.dirty||familyOutbox.snapshot?.groups?.length!==2)throw new Error('family sync outbox not queued');

    const localFamilyEntry=saved.entries.find(x=>x.childId==='child-a');
    if(!localFamilyEntry)throw new Error('family sync local entry missing');
    const olderFamilyMerge=w.AktywnikCloudBridge.mergeFamilyCloudEntries('child-a',[{
      client_entry_id:localFamilyEntry.id,
      activity_date:localFamilyEntry.date,
      activity_type:localFamilyEntry.activity,
      minutes:5,
      effort:1,
      note:'older remote',
      status:'approved',
      source:'manual',
      rejection_reason:null,
      approved_at:'2000-01-01T00:00:00.000Z',
      client_updated_at:'2000-01-01T00:00:00.000Z',
      updated_at:'2000-01-01T00:00:00.000Z'
    }]);
    if(olderFamilyMerge.localNewer!==1)throw new Error('older family cloud entry did not preserve local version');
    w.AktywnikFamilySync.clear();

    const linkBackup=w.makeBackupPayload(saved);
    const linkRestored=w.backupStateFromPayload(linkBackup);
    if(linkRestored.children.find(x=>x.id==='child-a')?.cloudChildId!==cloudA||linkRestored.children.find(x=>x.id===childB.id)?.cloudChildId!==cloudB)throw new Error('family cloud links not preserved in backup');

    let duplicateCloudLinkBlocked=false;
    try{
      w.backupStateFromPayload({
        format:'aktywnik-plus-backup',
        version:6,
        data:{...saved,children:saved.children.map((c,i)=>({...c,cloudChildId:i<2?cloudA:c.cloudChildId}))}
      });
    }catch(err){duplicateCloudLinkBlocked=/ten sam profil chmurowy/i.test(String(err?.message||err))}
    if(!duplicateCloudLinkBlocked)throw new Error('duplicate cloud child link backup was not blocked');

    let invalidCloudLinkBlocked=false;
    try{
      w.backupStateFromPayload({
        format:'aktywnik-plus-backup',
        version:6,
