<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>Aktywnik+ PWA smoke</title></head>
<body>
<div id="result">RUNNING</div>
<script>
const result=document.getElementById('result');
function fail(msg){result.textContent='FAIL: '+msg;document.body.dataset.test='fail'}
function pass(msg){result.textContent='PASS: '+msg;document.body.dataset.test='pass'}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{
  try{
    if(!('serviceWorker' in navigator))throw new Error('service worker API unavailable');
    const withTimeout=(promise,label,ms=10000)=>Promise.race([
      promise,
      new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out')),ms))
    ]);
    const registration=await withTimeout(navigator.serviceWorker.register('../sw.js'),'service worker registration');
    // navigator.serviceWorker.ready may remain pending in fresh headless profiles.
    // Observe registration state directly and fail within a bounded interval.
    let active=false;
    for(let i=0;i<100;i++){
      if(registration.active?.state==='activated'){active=true;break;}
      await sleep(100);
    }
    if(!active)throw new Error('service worker activation timed out');
    if(!navigator.serviceWorker.controller){
      if(sessionStorage.getItem('aktywnik-pwa-smoke-reloaded')==='1')
        throw new Error('service worker did not control page after reload');
      sessionStorage.setItem('aktywnik-pwa-smoke-reloaded','1');
      location.reload();
      return;
    }
    sessionStorage.removeItem('aktywnik-pwa-smoke-reloaded');
    let regs=[];
    for(let i=0;i<40;i++){
      regs=await withTimeout(navigator.serviceWorker.getRegistrations(),'service worker registrations');
      if(regs.length)break;
      await sleep(100);
    }
    if(!regs.length)throw new Error('service worker not registered');
    let names=[];
    for(let i=0;i<50;i++){
      names=await withTimeout(caches.keys(),'cache keys');
      if(names.some(n=>n.startsWith('aktywnik-plus-v')))break;
      await sleep(100);
    }
    if(!names.some(n=>n.startsWith('aktywnik-plus-v')))throw new Error('PWA cache missing');
    const manifest=await withTimeout(fetch('../manifest.webmanifest').then(r=>{if(!r.ok)throw new Error('manifest HTTP '+r.status);return r.json()}),'manifest fetch');
    if(manifest.start_url!=='./app.html')throw new Error('manifest start_url invalid');
    if(!Array.isArray(manifest.icons)||manifest.icons.length<2)throw new Error('manifest icons missing');
    const cache=await withTimeout(caches.open(names.find(n=>n.startsWith('aktywnik-plus-v'))),'cache open');
    const assets=['../app.html','../app.js','../styles.css'].map(x=>new URL(x,location.href).href);
    for(const asset of assets){
      let hit=null;
      for(let i=0;i<50;i++){
        hit=await withTimeout(cache.match(asset),'cache match: '+asset);
        if(hit)break;
        await sleep(100);
      }
      if(!hit)throw new Error('cached asset missing: '+asset);
    }
    pass('service worker, cache, manifest and core assets');
  }catch(e){fail(e.message||String(e))}
})();
</script>
</body>
</html>
